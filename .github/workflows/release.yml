name: Draft Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/windows.yml

  package:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit belongs to main
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to commits on main.' }
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: portable-windows-x64
          path: |
            artifacts/releases/D2XPad-*-win-x64.zip
            artifacts/releases/D2XPad-*-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  draft:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portable-windows-x64
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="D2XPad-${GITHUB_REF_NAME}-win-x64.zip"
          sha256sum --check "$archive.sha256"
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --draft --generate-notes --title "D2XPad $GITHUB_REF_NAME" "${release_flags[@]}"
