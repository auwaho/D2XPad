name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Run Windows tests
        shell: pwsh
        run: ./scripts/Test.ps1
